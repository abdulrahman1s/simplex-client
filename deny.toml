# cargo-deny: licences, advisories, duplicate versions, sources. Run with `cargo deny check`.

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "wasm32-unknown-unknown"]
all-features = false

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # sqlx-sqlite 0.9 pins libsqlite3-sys < 0.38; the fix is in 0.39. Drop this once sqlx allows it.
    { id = "RUSTSEC-2026-0459", reason = "no sqlx 0.9 compatible libsqlite3-sys fix yet" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "AGPL-3.0-only",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "async-std" },
    { crate = "reqwest" },
    { crate = "chrono" },
    { crate = "rusqlite", reason = "the store goes through ormlite" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
